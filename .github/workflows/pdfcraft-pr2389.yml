
name: PdfCraft PR 2389 - Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Baixar codigo do PR 2389
        uses: actions/checkout@v4
        with:
          repository: regendorf-ux/pdfcraft
          ref: pr/xlsx-export
          persist-credentials: false

      - name: Preparar traducoes
        uses: storytold/craft-common-actions/actions/checkout-craft-i18n@main

      - name: Preparar fontes
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Preparar instalador
        uses: storytold/craft-common-actions/actions/install-wix@main
        with:
          wix-version: 5.0.2

      - name: Compilar PdfCraft
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: ./packaging/windows/package.ps1 -Arch x64

      - name: Disponibilizar download
        uses: actions/upload-artifact@v4
        with:
          name: PdfCraft-PR2389-Windows-x64
          path: dist/release/*
          if-no-files-found: error
